<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <radialGradient id="psGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="psCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <filter id="psShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1000" height="680" fill="#0c0d12"/>
  <rect width="1000" height="680" fill="url(#psGlow)"/>

  <!-- Comparison Title -->
  <g transform="translate(60, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff">
      OpenCode Desktop Model &amp; Provider Selector Architecture
    </text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#94a3b8">
      Sustitución completa del menú nativo por un panel modal flotante moderno, reactivo y accesible.
    </text>
  </g>

  <!-- Left: Popover View -->
  <g transform="translate(60, 110)" filter="url(#psShadow)">
    <rect width="440" height="520" rx="14" fill="url(#psCardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

    <!-- Search Input -->
    <g transform="translate(18, 18)">
      <rect width="404" height="40" rx="9" fill="#202025" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="16" cy="20" r="5" stroke="#71717a" stroke-width="1.8" fill="none"/>
      <path d="M20 24L24 28" stroke="#71717a" stroke-width="1.8" stroke-linecap="round"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#ffffff">glm</text>
      <line x1="60" y1="12" x2="60" y2="28" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Clear icon -->
      <circle cx="380" cy="20" r="8" fill="#27272a"/>
      <path d="M377 17l6 6M383 17l-6 6" stroke="#a1a1aa" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Group: OpenCode (Filtered match) -->
    <g transform="translate(18, 76)">
      <!-- Provider Header -->
      <rect width="404" height="30" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
      <path d="M12 13l3 3 3-3" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <rect x="26" y="6" width="18" height="18" rx="3.5" fill="#09090b" stroke="#3b82f6" stroke-width="1.2"/>
      <path d="M30 11l3 3-3 3M35 17h3" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
      <text x="52" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">OpenCode (Free)</text>
      <rect x="162" y="7" width="38" height="16" rx="8" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="169" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">FREE</text>

      <!-- Model 1 (Active Focused) -->
      <g transform="translate(0, 36)">
        <rect width="404" height="44" rx="8" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
        <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">
          OpenCode <tspan fill="#38bdf8">Glm</tspan> 5.3 Flash Free
        </text>
        <rect x="234" y="13" width="38" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="241" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">FREE</text>
        <!-- Active Checkmark -->
        <circle cx="380" cy="22" r="9" fill="#3b82f6"/>
        <path d="M376 22L379 25L384 19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Model 2 -->
      <g transform="translate(0, 86)">
        <rect width="404" height="40" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
          <tspan fill="#38bdf8">GLM</tspan>-5.2 · ZCode
        </text>
        <rect x="145" y="11" width="38" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="152" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">FREE</text>
      </g>

      <!-- Model 3 -->
      <g transform="translate(0, 132)">
        <rect width="404" height="40" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
          <tspan fill="#38bdf8">GLM</tspan>-5-Turbo · ZCode
        </text>
        <rect x="160" y="11" width="38" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="167" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">FREE</text>
      </g>
    </g>

    <!-- Group: DeepSeek -->
    <g transform="translate(18, 266)">
      <rect width="404" height="30" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
      <path d="M12 13l3 3 3-3" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <rect x="26" y="6" width="18" height="18" rx="4" fill="rgba(29, 114, 242, 0.2)"/>
      <circle cx="32" cy="13" r="2" fill="#38bdf8"/>
      <path d="M32 15c2 0 4-1.5 5-3" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
      <text x="52" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">DeepSeek</text>

      <g transform="translate(0, 36)">
        <rect width="404" height="40" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">DeepSeek-V4.1-Flash</text>
        <rect x="160" y="11" width="44" height="18" rx="4" fill="rgba(59, 130, 246, 0.2)"/>
        <text x="166" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">1017</text>
      </g>
    </g>

    <!-- Footer -->
    <g transform="translate(18, 470)">
      <line x1="0" y1="0" x2="404" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="4" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#64748b">
        <tspan fill="#94a3b8">↑↓</tspan> Seleccionar · <tspan fill="#94a3b8">↵</tspan> Confirmar
      </text>
      <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">+ Conectar</text>
    </g>
  </g>

  <!-- Right: Hover Tooltip & Trigger Redesign Breakdown -->
  <g transform="translate(540, 110)">
    <!-- Feature 1: Trigger Button Design -->
    <g transform="translate(0, 0)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
        1. BOTÓN TRIGGER EN COMPOSER BAR
      </text>
      <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#94a3b8">
        Chip redondeado con logo de marca, estado Free y chevron reactivo:
      </text>

      <!-- The Rendered Trigger -->
      <g transform="translate(0, 36)">
        <rect width="280" height="34" rx="8" fill="#18181b" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <!-- Brand Icon -->
        <rect x="8" y="7" width="20" height="20" rx="4" fill="#09090b" stroke="#3b82f6" stroke-width="1.2"/>
        <path d="M12 13l3 3-3 3M17 19h3" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
        <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
          OpenCode Glm 5.3 Flash
        </text>
        <rect x="200" y="9" width="34" height="16" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="206" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="9" font-weight="700" fill="#34d399">FREE</text>
        <!-- Chevron -->
        <path d="M256 15l4 4 4-4" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- Feature 2: Rich Spec Tooltip -->
    <g transform="translate(0, 120)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
        2. TOOLTIP FLOTANTE DE ESPECIFICACIONES
      </text>
      <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#94a3b8">
        Inspecciona tokens, capacidades y precios al pasar el cursor:
      </text>

      <!-- Tooltip Box -->
      <g transform="translate(0, 36)" filter="url(#psShadow)">
        <rect width="380" height="190" rx="10" fill="#1f1f23" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
          GLM-5.3-Flash Free
        </text>
        <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">
          Modelo gratuito optimizado para codificación y razonamiento veloz.
        </text>

        <line x1="18" y1="68" x2="362" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

        <!-- Specs Grid -->
        <g transform="translate(18, 86)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12">
          <text fill="#71717a">Contexto:</text>
          <text x="90" font-weight="600" fill="#e2e8f0">128,000 tokens</text>

          <text y="24" fill="#71717a">Salida máx:</text>
          <text x="90" y="24" font-weight="600" fill="#e2e8f0">8,192 tokens</text>

          <text y="48" fill="#71717a">Precios:</text>
          <text x="90" y="48" font-weight="700" fill="#10b981">100% Gratuito (0.00 $)</text>

          <text y="72" fill="#71717a">Capacidades:</text>
          <text x="90" y="72" font-weight="600" fill="#38bdf8">Código, Herramientas, Visión</text>
        </g>
      </g>
    </g>

    <!-- Feature 3: Full Keyboard Navigation -->
    <g transform="translate(0, 400)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
        3. ACCESIBILIDAD Y TECLADO ULTRA-RÁPIDO
      </text>
      <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#94a3b8">
        Operación 100% libre de ratón para desarrolladores exigentes:
      </text>

      <g transform="translate(0, 36)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">
        <rect width="380" height="50" rx="8" fill="#18181b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <text x="14" y="24" font-weight="500">
          <tspan font-family="monospace" fill="#38bdf8">[↑] [↓]</tspan> Navegar opciones con scroll automático
        </text>
        <text x="14" y="40" font-weight="500">
          <tspan font-family="monospace" fill="#10b981">[Enter]</tspan> Seleccionar modelo · <tspan font-family="monospace" fill="#f43f5e">[Esc]</tspan> Descartar
        </text>
      </g>
    </g>
  </g>
</svg>
