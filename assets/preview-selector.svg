<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <radialGradient id="psGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="psCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <filter id="psShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1000" height="680" fill="#0b0c10"/>
  <rect width="1000" height="680" fill="url(#psGlow)"/>

  <!-- Header Title -->
  <g transform="translate(60, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff">
      Arquitectura Compacta: Selector de Proveedores y Modelos (236px)
    </text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#94a3b8">
      Diseño ultra compacto nativo con jerarquía: Menú Inicial ("Proveedores" y "Esfuerzo") → Lista de Proveedores → Lista de Modelos.
    </text>
  </g>

  <!-- Card 1: VISTA INICIAL (ROOT) -->
  <g transform="translate(60, 110)" filter="url(#psShadow)">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
      1. MENÚ PRINCIPAL (ROOT)
    </text>
    <rect width="250" height="110" rx="8" fill="url(#psCardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.8"/>

    <!-- Row 1: Proveedores -->
    <g transform="translate(6, 8)">
      <rect width="238" height="28" rx="5" fill="rgba(255, 255, 255, 0.04)"/>
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#f4f3ee">🏢 Proveedores</text>
      <text x="180" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" fill="#94a3b8">Magpie</text>
      <text x="224" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#64748b">›</text>
    </g>

    <!-- Separator -->
    <line x1="8" y1="46" x2="242" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.5"/>

    <!-- Row 2: Esfuerzo -->
    <g transform="translate(6, 56)">
      <rect width="238" height="28" rx="5" fill="transparent"/>
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#f4f3ee">⚡ Esfuerzo</text>
      <text x="190" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" fill="#94a3b8">Alto</text>
      <text x="224" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#64748b">›</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <g transform="translate(330, 210)">
    <path d="M0 0 L30 0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="30,-4 38,0 30,4" fill="#38bdf8"/>
    <text x="-15" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#94a3b8">Click "Proveedores"</text>
  </g>

  <!-- Card 2: LISTA DE PROVEEDORES -->
  <g transform="translate(390, 110)" filter="url(#psShadow)">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
      2. SUB-VISTA: PROVEEDORES
    </text>
    <rect width="250" height="220" rx="8" fill="url(#psCardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.8"/>

    <!-- Header: Back -->
    <g transform="translate(6, 6)">
      <rect width="238" height="24" rx="4" fill="transparent"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">← Proveedores</text>
      <line x1="0" y1="26" x2="238" y2="26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.5"/>
    </g>

    <!-- Provider Items (28px each) -->
    <g transform="translate(6, 38)">
      <!-- Item 1: OpenCode Desktop -->
      <rect width="238" height="28" rx="5" fill="transparent"/>
      <circle cx="16" cy="14" r="5" fill="#3b82f6"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#f4f3ee">OpenCode Desktop</text>
      <text x="224" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#64748b">›</text>

      <!-- Item 2: Magpie Responses -->
      <g transform="translate(0, 30)">
        <rect width="238" height="28" rx="5" fill="transparent"/>
        <circle cx="16" cy="14" r="5" fill="#10a37f"/>
        <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#f4f3ee">Magpie · Responses</text>
        <text x="224" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#64748b">›</text>
      </g>

      <!-- Item 3: Magpie Anthropic -->
      <g transform="translate(0, 60)">
        <rect width="238" height="28" rx="5" fill="transparent"/>
        <circle cx="16" cy="14" r="5" fill="#d97757"/>
        <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#f4f3ee">Magpie · Anthropic</text>
        <text x="224" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#64748b">›</text>
      </g>

      <!-- Item 4: Magpie (Active) -->
      <g transform="translate(0, 90)">
        <rect width="238" height="28" rx="5" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
        <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
        <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Magpie</text>
        <text x="206" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">✓</text>
        <text x="224" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#64748b">›</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <g transform="translate(660, 210)">
    <path d="M0 0 L30 0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="30,-4 38,0 30,4" fill="#38bdf8"/>
    <text x="-15" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#94a3b8">Elegir Proveedor</text>
  </g>

  <!-- Card 3: LISTA DE MODELOS -->
  <g transform="translate(710, 110)" filter="url(#psShadow)">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
      3. SUB-VISTA: MODELO
    </text>
    <rect width="250" height="220" rx="8" fill="url(#psCardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.8"/>

    <!-- Header: Back to providers -->
    <g transform="translate(6, 6)">
      <rect width="238" height="24" rx="4" fill="transparent"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">← Proveedores</text>
      <text x="180" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#64748b">Magpie</text>
      <line x1="0" y1="26" x2="238" y2="26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.5"/>
    </g>

    <!-- Search box -->
    <g transform="translate(10, 38)">
      <rect width="230" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.6"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#64748b">Buscar modelo...</text>
    </g>

    <!-- Model Rows for this provider only -->
    <g transform="translate(6, 70)">
      <!-- Model 1 (Active) -->
      <rect width="238" height="28" rx="5" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">Gemini 3.8 Flash</text>
      <rect x="180" y="6" width="28" height="15" rx="3" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="184" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="8.5" font-weight="700" fill="#38bdf8">NEW</text>
      <text x="218" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">✓</text>
    </g>
  </g>

  <!-- Bottom: Composer Trigger Pill comparison -->
  <g transform="translate(60, 480)">
    <rect width="900" height="150" rx="12" fill="#141418" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      Trigger Pill en la barra del Composer (DeepSeek Harness)
    </text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#94a3b8">
      Diferenciación instantánea sin abrir el menú: Proveedor Activo › Modelo Activo · Nivel de Esfuerzo
    </text>

    <!-- Trigger Pill Preview -->
    <g transform="translate(24, 75)">
      <rect width="320" height="34" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <circle cx="18" cy="17" r="7" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
      <path d="M14 17l3 3 5-5" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#94a3b8">Magpie</text>
      <text x="82" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#64748b">›</text>
      <text x="94" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#f4f3ee">Gemini 3.8 Flash</text>
      <rect x="235" y="8" width="46" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
      <text x="244" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8">HIGH</text>
      <path d="M298 15l4 4 4-4" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Features Pill -->
    <g transform="translate(420, 80)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#38bdf8">
        ✓ Ancho compacto exacto: 236px
      </text>
      <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#38bdf8">
        ✓ Altura estricta por fila: 28px
      </text>
      <text x="250" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#38bdf8">
        ✓ Menú inicial: "Proveedores" y "Esfuerzo"
      </text>
      <text x="250" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#38bdf8">
        ✓ Filtro exclusivo: solo modelos del proveedor elegido
      </text>
    </g>
  </g>
</svg>
