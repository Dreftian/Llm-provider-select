<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111113" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="primaryTextGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="420" fill="#090a0f"/>
  <rect width="1200" height="420" fill="url(#bgGlow1)"/>
  <rect width="1200" height="420" fill="url(#bgGlow2)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 75)">
    <!-- Tech Badge Pill -->
    <rect width="280" height="32" rx="16" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.5">OPENCODE DESKTOP V2 GUI</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="44" font-weight="800" fill="url(#primaryTextGrad)" letter-spacing="-1">
      LLM Provider Select
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Rediseño total del selector de modelos y proveedores para
    </text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">
      DeepSeek Harness <tspan fill="#64748b" font-weight="400">con la elegancia y fluidez de OpenCode Desktop</tspan>
    </text>

    <!-- Features Checkpoints -->
    <g transform="translate(0, 195)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#cbd5e1">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="6" fill="#10b981" fill-opacity="0.2"/>
      <path d="M3.5 6L5.5 8L8.5 4" stroke="#10b981" stroke-width="1.6" stroke-linecap="round"/>
      <text x="22" y="10" font-weight="500">Búsqueda difusa en tiempo real</text>

      <!-- Item 2 -->
      <circle cx="6" cy="34" r="6" fill="#3b82f6" fill-opacity="0.2"/>
      <path d="M3.5 34L5.5 36L8.5 32" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round"/>
      <text x="22" y="38" font-weight="500">Acordeones de proveedores e iconos SVG</text>

      <!-- Item 3 -->
      <circle cx="6" cy="62" r="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <path d="M3.5 62L5.5 64L8.5 60" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round"/>
      <text x="22" y="66" font-weight="500">Tooltips de especificaciones, precios y tokens</text>
    </g>
  </g>

  <!-- Right Side: Beautiful OpenCode Popover Mockup -->
  <g transform="translate(680, 30)" filter="url(#shadowBox)">
    <!-- Popover Card Container -->
    <rect width="440" height="360" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

    <!-- Search Bar -->
    <g transform="translate(16, 16)">
      <rect width="408" height="38" rx="8" fill="#202024" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <!-- Search Icon -->
      <path d="M14 19L18 23" stroke="#71717a" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="10" cy="15" r="4.5" stroke="#71717a" stroke-width="1.8" fill="none"/>
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">Buscar modelo o proveedor...</text>
      <!-- Esc badge -->
      <rect x="366" y="8" width="30" height="22" rx="4" fill="#27272a"/>
      <text x="373" y="23" font-family="monospace" font-size="11" fill="#71717a">ESC</text>
    </g>

    <!-- Group 1: OpenCode Free -->
    <g transform="translate(16, 70)">
      <rect width="408" height="28" rx="6" fill="transparent"/>
      <!-- Chevron Down -->
      <path d="M10 12l3 3 3-3" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- OpenCode Brand Icon -->
      <rect x="22" y="5" width="18" height="18" rx="3.5" fill="#09090b" stroke="#3b82f6" stroke-width="1.2"/>
      <path d="M26 10l3 3-3 3M31 16h3" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
      <text x="46" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">OpenCode (Free)</text>
      <rect x="156" y="6" width="38" height="16" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="0.8"/>
      <text x="163" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">FREE</text>

      <!-- Active Model Row -->
      <g transform="translate(0, 32)">
        <rect width="408" height="38" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">GLM-5.3-Flash Free</text>
        <rect x="150" y="10" width="38" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="157" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">FREE</text>
        <rect x="194" y="10" width="36" height="18" rx="4" fill="rgba(59, 130, 246, 0.2)"/>
        <text x="201" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">128K</text>
        <!-- Checkmark -->
        <circle cx="388" cy="19" r="9" fill="#3b82f6"/>
        <path d="M384 19L387 22L392 16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Group 2: DeepSeek -->
    <g transform="translate(16, 155)">
      <!-- Chevron Down -->
      <path d="M10 12l3 3 3-3" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- DeepSeek Whale Icon -->
      <rect x="22" y="5" width="18" height="18" rx="4" fill="rgba(29, 114, 242, 0.2)"/>
      <circle cx="28" cy="12" r="2" fill="#38bdf8"/>
      <path d="M28 14c2 0 4-1.5 5-3" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
      <text x="46" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">DeepSeek</text>

      <!-- Model Row 1: V3 -->
      <g transform="translate(0, 32)">
        <rect width="408" height="36" rx="7" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">DeepSeek-V3</text>
        <rect x="110" y="9" width="46" height="18" rx="4" fill="rgba(168, 85, 247, 0.2)"/>
        <text x="116" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#c084fc">LATEST</text>
        <rect x="162" y="9" width="36" height="18" rx="4" fill="rgba(255, 255, 255, 0.08)"/>
        <text x="169" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">64K</text>
      </g>

      <!-- Model Row 2: R1 -->
      <g transform="translate(0, 72)">
        <rect width="408" height="36" rx="7" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">DeepSeek-R1 (Reasoning)</text>
        <rect x="178" y="9" width="70" height="18" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
        <text x="184" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">REASONING</text>
      </g>
    </g>

    <!-- Group 3: Anthropic Header -->
    <g transform="translate(16, 275)">
      <!-- Chevron Down -->
      <path d="M10 12l3 3 3-3" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- Anthropic Spark Icon -->
      <rect x="22" y="5" width="18" height="18" rx="4" fill="rgba(217, 119, 87, 0.2)"/>
      <path d="M28 8l-2 8h2l2-8h-2z" fill="#D97757"/>
      <text x="46" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Anthropic Claude</text>
    </g>

    <!-- Bottom Actions Footer -->
    <g transform="translate(16, 316)">
      <line x1="0" y1="0" x2="408" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="4" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#64748b">
        <tspan fill="#94a3b8">↑↓</tspan> Navegar · <tspan fill="#94a3b8">↵</tspan> Seleccionar · <tspan fill="#94a3b8">Esc</tspan> Cerrar
      </text>
      <text x="320" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" fill="#38bdf8" cursor="pointer">+ Gestionar</text>
    </g>
  </g>
</svg>
